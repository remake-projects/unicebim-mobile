name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full report for reading. The current "high" findings (braces, node-forge) sit in Expo's
      # build tooling, are not shipped in the app and are fixed by Expo SDK updates.
      - run: npm audit --omit=dev
        continue-on-error: true
      - run: npm audit --omit=dev --audit-level=critical
